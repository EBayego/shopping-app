name: Provider live tests

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider live suite to run
        required: true
        default: dia
        type: choice
        options:
          - all
          - dia
          - mercadona
          - alcampo
          - eroski
      compare_runners:
        description: Compare access on Ubuntu, Windows and macOS hosted by GitHub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live-test:
    name: Live tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ inputs.compare_runners && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    environment: provider-live-tests
    env:
      CI: true
      RUN_LIVE_PROVIDER_TESTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run selected provider live tests
        if: inputs.provider != 'all'
        run: pnpm exec vitest run "providers/${{ inputs.provider }}/src/${{ inputs.provider }}-provider.live.test.ts"

      - name: Run all provider live tests
        if: inputs.provider == 'all'
        run: pnpm test:live

      - name: Run Mercadona catalog price refresh live test
        if: inputs.provider == 'mercadona'
        run: pnpm exec vitest run tooling/ingest/src/mercadona-catalog-refresh.live.test.ts
