name: Provider live tests

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider live suite to run
        required: true
        default: dia
        type: choice
        options:
          - dia
          - mercadona
          - eroski

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: provider-live-tests
    env:
      CI: true
      RUN_LIVE_PROVIDER_TESTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run selected provider live tests
        run: pnpm exec vitest run "providers/${{ inputs.provider }}/src/${{ inputs.provider }}-provider.live.test.ts"
